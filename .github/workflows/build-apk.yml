name: Compilador APK Matibatidos RC6

on:
  workflow_dispatch:
  push:
    branches:
      - principal
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK RC6
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Localizar ZIP del proyecto
        id: locate
        shell: bash
        run: |
          ZIP_PATH=$(find . -maxdepth 1 -type f \
            -iname 'Matibatidos_RC6_EXCEL_RENDIMIENTO_CORREGIDO*.zip' \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::No se encontró el ZIP RC6 en la raíz."
            exit 1
          fi

          echo "Archivo encontrado: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Extraer proyecto
        id: extract
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.locate.outputs.zip_path }}" -d extracted

          APP_GRADLE=$(find extracted -type f \
            \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) \
            -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "::error::No se encontró app/build.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::No se encontró settings.gradle."
            exit 1
          fi

          echo "Proyecto: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK
        id: android
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "::error::No se encontró Android SDK."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager."
            exit 1
          fi

          echo "SDK encontrado: $SDK"
          echo "sdkmanager encontrado: $SDKMANAGER"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Instalar componentes Android
        shell: bash
        run: |
          SDKMANAGER="${{ steps.android.outputs.sdkmanager }}"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar configuración RC6
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.extract.outputs.project_dir }}"

          echo "Application ID:"
          grep -n "applicationId" "$PROJECT_DIR/app/build.gradle" || true

          echo "Version Code:"
          grep -n "versionCode" "$PROJECT_DIR/app/build.gradle" || true

          echo "Version Name:"
          grep -n "versionName" "$PROJECT_DIR/app/build.gradle" || true

      - name: Compilar APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.extract.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.extract.outputs.project_dir }}"

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::No se generó la APK."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Matibatidos-RC6-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/release/"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-RC6-APK
          path: release/Matibatidos-RC6-debug.apk
          if-no-files-found: error
          retention-days: 14
