name: Compilador APK RC6

on:
  workflow_dispatch:
  push:
    branches:
      - principal
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Matibatidos RC6
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Localizar archivo ZIP RC6
        id: locate
        shell: bash
        run: |
          ZIP_PATH=$(find . -maxdepth 1 -type f \
            -iname 'Matibatidos_RC6_EXCEL_RENDIMIENTO_CORREGIDO*.zip' \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::No se encontró el ZIP RC6 en la raíz del repositorio."
            echo "Archivos ZIP disponibles:"
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Extraer proyecto RC6
        id: extract
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.locate.outputs.zip_path }}" -d extracted

          APP_GRADLE=$(find extracted -type f \
            \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) \
            -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "::error::No se encontró app/build.gradle dentro del ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::No se encontró settings.gradle en el proyecto."
            exit 1
          fi

          echo "Proyecto localizado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar proyecto Android
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.extract.outputs.project_dir }}"

          echo "Revisando configuración..."

          grep -n "applicationId" "$PROJECT_DIR/app/build.gradle" || true
          grep -n "versionCode" "$PROJECT_DIR/app/build.gradle" || true
          grep -n "versionName" "$PROJECT_DIR/app/build.gradle" || true

          echo "Verificación completada."

      - name: Compilar APK RC6
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.extract.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK generada
        id: apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.extract.outputs.project_dir }}"

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::No se encontró la APK después de compilar."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/Matibatidos-RC6-debug.apk"

          echo "APK generada:"
          ls -lh "$GITHUB_WORKSPACE/release/Matibatidos-RC6-debug.apk"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-RC6-APK
          path: release/Matibatidos-RC6-debug.apk
          if-no-files-found: error
          retention-days: 14
